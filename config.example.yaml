# omp-warden config (YAML). Save as config.yaml / config.yml / config.json in:
#   $PI_CODING_AGENT_DIR/omp-warden/   (default ~/.omp/agent/omp-warden/)
# Everything is optional — omit a key for its default. A config with any error is ignored as a
# whole (defaults used), so a typo can't half-apply. The scalars (enabled, debug, judgeRole,
# llmRole, onNoAnswer, includeContext) are also settable via `omp /settings`; rules are file-only.

enabled: true
debug: false            # print each checked call, its rule scores and the verdict to chat

# Models are chosen by omp model role. Set a role to null to disable that stage.
judgeRole: judge        # stage 1 classifier — a native judge (e.g. modelRoles.judge: local/lfm2-1.2b)
llmRole: smol           # stage 2 for the unsure band; falls back to the "default" role when unset

onNoAnswer: block       # when the judge can't answer (down/timeout): block | ask | allow
includeContext: true    # send the conversation so already-authorized calls aren't re-asked
timeoutMs: 20000
maxTokens: 512

# Every rule whose `tools` match a call is scored in one request; the worst verdict wins and the
# tripped rule's `description` is shown. Per rule, by the classifier's risk:
#   risk < allowBelow             -> run
#   allowBelow <= risk < askAbove -> unsure -> the llm decides (or run, if the llm stage is off)
#   askAbove <= risk              -> ask the user
#   risk > blockAbove (optional)  -> block outright
rules:
  # The general "auto-mode" gate: a broad allow/ask/block judgment over every tool. This is the
  # built-in default — you get exactly this rule with no `rules:` block at all.
  - name: auto-mode
    description: General safety check
    tools: ["*"]
    type: choice          # allow/ask/block decision (risk = 1 - P(allow))
    allowBelow: 0.1
    askAbove: 0.2
    # blockAbove omitted -> ask-only (never auto-blocks)
    # instructions / criteria: omit to use the built-in allow/ask/block policy, or set to override

  # Optional sharper overlays: specific hazards that can hard-block and give a precise reason.
  - name: data-exfiltration
    description: Sending data to an untrusted destination
    tools: [bash, web_fetch, fetch, http]
    type: noul            # a yes/no hazard (risk = P(yes)); inferred when `question` is present
    question: "Does this send code, data, logs, env vars or files to a third party, an unknown host, a paste/share site, or a public destination?"
    yes: "Data leaves the user's trusted systems."
    no: "Nothing leaves the user's trusted systems."
    allowBelow: 0.1
    askAbove: 0.3
    blockAbove: 0.8

  - name: modifies-production
    description: Changing a production system
    tools: [bash]
    question: "Does this change, delete, deploy to, restart or migrate a production system?"
    yes: "It changes the state of production."
    no: "It does not touch production."
    askAbove: 0.5
    # blockAbove omitted -> this hazard only asks
